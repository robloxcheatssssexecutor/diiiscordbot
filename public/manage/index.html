<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111318" />
  <link rel="icon" href="https://i.imgur.com/lst2PVm.png" type="image/png" />
  <link rel="preconnect" href="https://i.imgur.com" />
  <title>Manage — Falcao External</title>
  <style>
    :root { --bg:#0a0b10; --card:#14161e; --stroke:#2a3040; --text:#eef1f7; --muted:#9aa3b5; --accent:#ff8a33; --accent-dim:rgba(255,138,51,.14); --ok:#3ecf6a; --err:#ff5d5d; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,Segoe UI,system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    .nav { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--stroke); background:#0e1016; position:sticky; top:0; z-index:20; }
    .nav img { width:48px; height:48px; border-radius:10px; object-fit:contain; }
    .nav h1 { margin:0; font-size:.95rem; flex:1; }
    .nav a, .nav button { text-decoration:none; font:inherit; border-radius:10px; padding:8px 14px; font-weight:600; cursor:pointer; border:1px solid var(--stroke); background:#1a1e28; color:var(--text); }
    .nav a:hover, .nav button:hover { border-color:var(--accent); color:var(--accent); }
    .wrap { max-width:1100px; margin:0 auto; padding:16px; }
    .card { background:var(--card); border:1px solid var(--stroke); border-radius:14px; padding:16px; margin-bottom:14px; }
    .hidden { display:none !important; }
    .login-box { max-width:420px; margin:60px auto; text-align:center; }
    .login-box img { width:72px; border-radius:14px; margin-bottom:12px; box-shadow:0 0 32px rgba(255,138,51,.25); }
    .btn { border:0; border-radius:12px; padding:11px 16px; font-weight:600; cursor:pointer; background:var(--accent); color:#111; }
    .btn.secondary { background:#252b39; color:var(--text); }
    .btn.danger { background:rgba(255,93,93,.15); color:var(--err); border:1px solid rgba(255,93,93,.35); }
    .btn.sm { padding:6px 10px; font-size:.75rem; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
    input, select { padding:10px 12px; border-radius:10px; border:1px solid var(--stroke); background:#0d1017; color:var(--text); font:inherit; }
    input[type=search] { flex:1; min-width:180px; }
    table { width:100%; border-collapse:collapse; font-size:.82rem; }
    th, td { padding:10px 8px; border-bottom:1px solid rgba(255,255,255,.06); text-align:left; vertical-align:top; }
    th { color:var(--muted); font-weight:500; font-size:.72rem; text-transform:uppercase; }
    .key-cell { font-family:Consolas,monospace; font-size:.78rem; word-break:break-all; }
    .status-active { color:var(--ok); }
    .status-expired { color:var(--err); }
    .msg { font-size:.84rem; color:var(--muted); margin-top:8px; }
    .msg.err { color:var(--err); }
    .actions { display:flex; flex-wrap:wrap; gap:4px; }
    @media (max-width:800px) { table, thead, tbody, th, td, tr { display:block; } thead { display:none; } tr { margin-bottom:12px; border:1px solid var(--stroke); border-radius:10px; padding:8px; } td { border:0; padding:4px 0; } td::before { content:attr(data-label); color:var(--muted); display:block; font-size:.7rem; margin-bottom:2px; } }
  </style>
</head>
<body>
  <header class="nav">
    <img src="https://i.imgur.com/0nTvfnO.png" alt="Falcao" />
    <h1>Manage — Licencias</h1>
    <a href="/">Inicio</a>
    <button type="button" id="logoutBtn" class="hidden">Salir</button>
  </header>

  <div class="wrap">
    <section id="loginView" class="card login-box">
      <img src="https://i.imgur.com/0nTvfnO.png" alt="Falcao" />
      <h2 style="margin:0 0 8px">Panel de administracion</h2>
      <p class="msg">Solo administradores autorizados (Discord).</p>
      <button class="btn" type="button" id="discordLoginBtn" style="margin-top:14px;background:#5865f2;color:#fff">Iniciar sesion con Discord</button>
      <p id="loginMsg" class="msg err"></p>
    </section>

    <section id="manageView" class="hidden">
      <div class="card">
        <div class="toolbar">
          <input type="search" id="searchInput" placeholder="Buscar key..." />
          <select id="createPlan"><option value="falcao">falcao</option><option value="temp">temp</option><option value="both">both</option></select>
          <input type="number" id="createDays" value="30" min="1" style="width:80px" title="Dias" />
          <button class="btn" type="button" id="createBtn">Crear licencia</button>
          <button class="btn secondary" type="button" id="refreshBtn">Actualizar</button>
        </div>
        <p id="listMsg" class="msg"></p>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>Key</th><th>Plan</th><th>Estado</th><th>Expira</th><th>HWID</th><th>Acciones</th>
              </tr>
            </thead>
            <tbody id="keysBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    async function api(path, opts = {}) {
      const res = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, opts));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || "Error");
      return data;
    }

    function fmtDate(v) {
      if (!v) return "—";
      return new Date(v).toLocaleString("es-ES", { dateStyle: "short", timeStyle: "short" });
    }

    function showAuth(ok) {
      $("loginView").classList.toggle("hidden", ok);
      $("manageView").classList.toggle("hidden", !ok);
      $("logoutBtn").classList.toggle("hidden", !ok);
    }

    async function checkAuth() {
      try {
        const d = await api("/api/manage/auth/status");
        showAuth(!!d.authenticated);
        if (d.authenticated) loadKeys();
      } catch (_) {
        showAuth(false);
      }
    }

    async function loadKeys() {
      $("listMsg").textContent = "Cargando...";
      try {
        const q = $("searchInput").value.trim();
        const d = await api("/api/manage/keys?q=" + encodeURIComponent(q) + "&limit=100");
        const body = $("keysBody");
        body.innerHTML = "";
        for (const k of d.keys) {
          const tr = document.createElement("tr");
          const stClass = k.status === "active" ? "status-active" : "status-expired";
          tr.innerHTML = `
            <td class="key-cell" data-label="Key">${k.key}</td>
            <td data-label="Plan">${k.plan}</td>
            <td data-label="Estado" class="${stClass}">${k.status}</td>
            <td data-label="Expira">${fmtDate(k.expiresAt)}</td>
            <td data-label="HWID" style="font-size:.72rem;max-width:120px;overflow:hidden;text-overflow:ellipsis">${k.hwid || "—"}</td>
            <td data-label="Acciones"><div class="actions" data-key="${k.key}"></div></td>`;
          const actions = tr.querySelector(".actions");
          const addBtn = document.createElement("button");
          addBtn.className = "btn sm secondary";
          addBtn.textContent = "+7d";
          addBtn.onclick = () => modTime(k.key, "add", "7d");
          const subBtn = document.createElement("button");
          subBtn.className = "btn sm secondary";
          subBtn.textContent = "-7d";
          subBtn.onclick = () => modTime(k.key, "remove", "7d");
          const hwBtn = document.createElement("button");
          hwBtn.className = "btn sm secondary";
          hwBtn.textContent = "Reset HWID";
          hwBtn.onclick = () => resetHwid(k.key);
          const delBtn = document.createElement("button");
          delBtn.className = "btn sm danger";
          delBtn.textContent = "Borrar";
          delBtn.onclick = () => deleteKey(k.key);
          actions.append(addBtn, subBtn, hwBtn, delBtn);
          body.appendChild(tr);
        }
        $("listMsg").textContent = d.total + " licencias";
      } catch (e) {
        $("listMsg").textContent = e.message;
        $("listMsg").className = "msg err";
      }
    }

    async function modTime(key, mode, duration) {
      const custom = prompt(mode === "add" ? "Añadir tiempo (ej: 7d, 2w, 30):" : "Quitar tiempo (ej: 7d):", duration);
      if (!custom) return;
      try {
        await api("/api/manage/keys/" + encodeURIComponent(key) + "/" + (mode === "add" ? "add-time" : "remove-time"), {
          method: "POST",
          body: JSON.stringify({ duration: custom })
        });
        loadKeys();
      } catch (e) { alert(e.message); }
    }

    async function resetHwid(key) {
      if (!confirm("Resetear HWID de " + key + "?")) return;
      try {
        await api("/api/manage/keys/" + encodeURIComponent(key) + "/reset-hwid", { method: "POST", body: "{}" });
        loadKeys();
      } catch (e) { alert(e.message); }
    }

    async function deleteKey(key) {
      if (!confirm("Borrar " + key + "?")) return;
      try {
        await api("/api/manage/keys/" + encodeURIComponent(key), { method: "DELETE" });
        loadKeys();
      } catch (e) { alert(e.message); }
    }

    $("discordLoginBtn").onclick = () => { window.location.href = "/api/manage/auth/login"; };
    $("logoutBtn").onclick = async () => { try { await api("/api/manage/auth/logout", { method: "POST", body: "{}" }); } catch (_) {} showAuth(false); };
    $("createBtn").onclick = async () => {
      try {
        const d = await api("/api/manage/keys", {
          method: "POST",
          body: JSON.stringify({ days: parseInt($("createDays").value, 10) || 30, plan: $("createPlan").value })
        });
        alert("Creada: " + d.key.key);
        loadKeys();
      } catch (e) { alert(e.message); }
    };
    $("refreshBtn").onclick = loadKeys;
    let searchTimer;
    $("searchInput").oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadKeys, 350); };

    checkAuth();
  </script>
</body>
</html>
