<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Reclamar Key – Falcao External</title>
  <link rel="icon" href="https://i.imgur.com/lst2PVm.png" type="image/png"/>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#08080c;--card:#121217;--card2:#1a1a22;--stroke:#2a2a35;--text:#e8e8ee;--muted:#8a8a9a;--accent:#e85822;--glow:rgba(232,88,34,.35);--green:#22c55e;--red:#ef4444}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100vh;font-family:"Instrument Sans",system-ui,sans-serif;background:var(--bg);color:var(--text)}
    #bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.4}
    .wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:32px 18px 60px}
    nav{display:flex;align-items:center;justify-content:space-between;padding:0 0 36px;gap:12px;flex-wrap:wrap}
    .logo-link{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:700;font-size:1.1rem}
    .logo-link img{width:36px;height:36px;border-radius:8px}
    .nav-links{display:flex;gap:10px;align-items:center}
    .nav-links a{text-decoration:none;color:var(--muted);font-size:.88rem;padding:6px 12px;border-radius:8px;transition:background .15s,color .15s}
    .nav-links a:hover{background:var(--card2);color:var(--text)}
    .nav-links a.active{color:var(--accent)}
    .card{background:var(--card);border:1px solid var(--stroke);border-radius:16px;padding:28px 28px}
    h1{font-size:1.5rem;font-weight:700;margin-bottom:6px}
    .sub{color:var(--muted);font-size:.9rem;line-height:1.6;margin-bottom:24px}
    label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px;font-weight:500}
    input[type=text]{width:100%;background:var(--card2);border:1px solid var(--stroke);color:var(--text);font-family:inherit;font-size:.95rem;padding:12px 14px;border-radius:10px;outline:none;transition:border-color .15s}
    input[type=text]:focus{border-color:var(--accent)}
    input[type=text]::placeholder{color:var(--muted)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;transition:transform .12s,opacity .12s;border:none;font-family:inherit;margin-top:14px}
    .btn:hover:not(:disabled){transform:translateY(-1px);opacity:.9}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-accent{background:var(--accent);color:#fff}
    .discord-btn{background:#5865f2;color:#fff;padding:13px;border-radius:12px;font-size:.95rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;margin-top:14px;transition:transform .12s,opacity .12s}
    .discord-btn:hover{transform:translateY(-1px);opacity:.9}
    .msg{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.88rem;display:none}
    .msg.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--green)}
    .msg.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red)}
    .divider{border:none;border-top:1px solid var(--stroke);margin:20px 0}
    .login-note{color:var(--muted);font-size:.82rem;text-align:center;margin-top:10px}
    .login-note a{color:var(--accent);text-decoration:none}
    .success-box{text-align:center;padding:28px 0 8px;display:none}
    .success-box .icon{font-size:3rem;margin-bottom:12px}
    .success-box h2{font-size:1.2rem;margin-bottom:8px}
    .success-box p{color:var(--muted);font-size:.9rem}
    .success-box a{display:inline-block;margin-top:16px;padding:11px 22px;background:var(--accent);color:#fff;border-radius:10px;font-weight:700;text-decoration:none;font-size:.9rem}
  </style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="wrap">
  <nav>
    <a class="logo-link" href="/"><img src="https://i.imgur.com/lst2PVm.png" alt="logo"/>Falcao External</a>
    <div class="nav-links">
      <a href="/">Inicio</a>
      <a href="/account">Mi Cuenta</a>
      <a href="/claim" class="active">Reclamar Key</a>
    </div>
  </nav>

  <div class="card" id="mainCard">
    <h1>🔑 Reclamar Key</h1>
    <p class="sub">Introduce tu key para vincularla a tu cuenta de Discord. Cada key solo puede ser reclamada una vez.</p>

    <div id="authSection" style="display:none">
      <p style="color:var(--muted);font-size:.88rem;margin-bottom:14px">Necesitas iniciar sesión con Discord para reclamar tu key.</p>
      <a class="discord-btn" href="/api/account/auth/login">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
        Iniciar sesión con Discord
      </a>
    </div>

    <div id="claimSection" style="display:none">
      <p id="userLine" style="font-size:.85rem;color:var(--muted);margin-bottom:16px"></p>
      <label for="keyInput">Tu Key</label>
      <input type="text" id="keyInput" placeholder="FALCAO-EXTERNAL-XXXXXX-XXXXXXX" autocomplete="off" spellcheck="false"/>
      <button class="btn btn-accent" id="claimBtn" onclick="claimKey()">Reclamar Key</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="success-box" id="successBox">
      <div class="icon">✅</div>
      <h2>Key reclamada</h2>
      <p id="successText"></p>
      <a href="/account">Ver mis keys →</a>
    </div>
  </div>
</div>

<script>
(function(){
  const c=document.getElementById("bgCanvas"),ctx=c.getContext("2d");
  let w,h,pts;
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;pts=Array.from({length:32},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3}));}
  function tick(){ctx.clearRect(0,0,w,h);for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;}for(let i=0;i<pts.length;i++){for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.hypot(dx,dy);if(d<130){ctx.strokeStyle=`rgba(232,88,34,${(1-d/130)*.18})`;ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.stroke();}}ctx.fillStyle="rgba(232,88,34,.55)";ctx.beginPath();ctx.arc(pts[i].x,pts[i].y,1.5,0,Math.PI*2);ctx.fill();}requestAnimationFrame(tick);}
  resize();window.addEventListener("resize",resize);tick();
})();

async function init(){
  const res=await fetch("/api/account/auth/status");
  const data=await res.json();
  if(!data.authenticated){
    document.getElementById("authSection").style.display="block";
  } else {
    document.getElementById("claimSection").style.display="block";
    document.getElementById("userLine").textContent=`Conectado como ${data.discordUsername} (${data.discordId})`;
  }
}

function showMsg(text,ok){
  const el=document.getElementById("msg");
  el.textContent=text;
  el.className="msg "+(ok?"ok":"err");
  el.style.display="block";
}

async function claimKey(){
  const key=document.getElementById("keyInput").value.trim();
  if(!key){showMsg("Introduce tu key primero.",false);return;}
  const btn=document.getElementById("claimBtn");
  btn.disabled=true;btn.textContent="Reclamando...";
  try{
    const res=await fetch("/api/account/claim",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key})});
    const data=await res.json();
    if(data.ok){
      document.getElementById("claimSection").style.display="none";
      const sb=document.getElementById("successBox");
      sb.style.display="block";
      const PLAN={falcao:"Falcao",temp:"Temp",both:"Both"};
      document.getElementById("successText").textContent=`Key "${data.key.key}" (plan ${PLAN[data.key.plan]||data.key.plan}) vinculada a tu cuenta.`;
    } else {
      showMsg(data.message||"Error al reclamar la key.",false);
    }
  } catch(e){
    showMsg("Error de red. Inténtalo de nuevo.",false);
  }
  btn.disabled=false;btn.textContent="Reclamar Key";
}

document.getElementById("keyInput")?.addEventListener("keydown",e=>{if(e.key==="Enter")claimKey();});
init();
</script>
</body>
</html>
