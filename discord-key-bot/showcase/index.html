<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Falcao External — Showcase</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      --layout: #101015;
      --section: #121217;
      --stroke: #2a2a35;
      --text: #e8e8ee;
      --muted: #8a8a9a;
      --accent: #e85822;
      --accent-dim: rgba(232, 88, 34, 0.18);
      --widget: #1c1c24;
      --ok: #3ecf6a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Inter, system-ui, sans-serif;
      background: #08080c;
      color: var(--text);
      overflow-x: hidden;
    }
    .scene {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 80px;
    }
    .preview-banner {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(232, 88, 34, 0.92);
      color: #111;
      text-align: center;
      padding: 8px 14px;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .preview-banner a { color: #111; }
    .hud-brand {
      position: fixed;
      top: 44px; left: 16px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 16, 21, 0.88);
      border: 1px solid var(--stroke);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.78rem;
      pointer-events: none;
    }
    .hud-brand img { width: 22px; height: 22px; border-radius: 4px; }
    .hud-brand .accent { color: var(--accent); font-weight: 700; }
    .hud-binds {
      position: fixed;
      top: 44px; right: 16px;
      z-index: 5;
      background: rgba(16, 16, 21, 0.88);
      border: 1px solid var(--stroke);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.72rem;
      pointer-events: none;
    }
    .hud-binds .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; color: var(--muted); }
    .hud-binds .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
    .menu-window {
      width: min(900px, 100%);
      height: 520px;
      background: var(--layout);
      border-radius: 10px;
      border: 1px solid var(--stroke);
      display: grid;
      grid-template-columns: 148px 1fr;
      grid-template-rows: 46px 1fr;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
      position: relative;
    }
    .menu-header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--stroke);
      background: var(--section);
      padding: 0 12px;
      gap: 10px;
    }
    .menu-header img { width: 36px; height: 36px; border-radius: 6px; }
    .menu-header .title { font-weight: 700; font-size: 0.95rem; }
    .menu-header .sub { color: var(--muted); font-size: 0.72rem; }
    .menu-header .tools { margin-left: auto; display: flex; gap: 8px; }
    .tool-btn {
      width: 30px; height: 30px;
      border-radius: 6px;
      border: 1px solid var(--stroke);
      background: var(--widget);
      color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem;
      pointer-events: none;
      opacity: 0.7;
    }
    .sidebar {
      background: var(--section);
      border-right: 1px solid var(--stroke);
      overflow-y: auto;
      padding: 8px 6px 12px;
    }
    .sb-group { margin-bottom: 4px; }
    .sb-group-hdr {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 8px;
      border-radius: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .sb-group-hdr.open { color: var(--accent); background: var(--accent-dim); }
    .sb-group-hdr i { width: 14px; text-align: center; }
    .sb-items { overflow: hidden; transition: max-height .2s ease; }
    .sb-item {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 8px 7px 28px;
      border-radius: 6px;
      font-size: 0.76rem;
      cursor: pointer;
    }
    .sb-item.active { color: var(--accent); background: var(--accent-dim); }
    .content {
      overflow-y: auto;
      padding: 14px 16px 20px;
    }
    .content h2 {
      margin: 0 0 12px;
      font-size: 0.95rem;
      color: var(--accent);
      font-weight: 600;
    }
    .group { margin-bottom: 14px; }
    .group-title {
      font-size: 0.82rem;
      color: var(--text);
      margin-bottom: 8px;
      opacity: 0.9;
    }
    .option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,.04);
    }
    .option label { font-size: 0.82rem; flex: 1; color: var(--text); }
    .ctrl { flex-shrink: 0; pointer-events: none; opacity: 0.85; }
    .toggle {
      width: 40px; height: 22px;
      background: #303040;
      border-radius: 999px;
      position: relative;
    }
    .toggle.on { background: var(--accent); }
    .toggle::after {
      content: "";
      position: absolute;
      width: 16px; height: 16px;
      top: 3px; left: 3px;
      background: #fff;
      border-radius: 50%;
    }
    .toggle.on::after { left: 21px; }
    .slider-wrap {
      display: flex; align-items: center; gap: 8px;
      min-width: 160px;
    }
    .slider-track {
      flex: 1; height: 4px;
      background: #303040;
      border-radius: 2px;
      position: relative;
    }
    .slider-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 40%;
    }
    .slider-val {
      font-size: 0.72rem;
      color: var(--muted);
      min-width: 42px;
      text-align: right;
    }
    select.fake, .fake-btn {
      background: var(--widget);
      border: 1px solid var(--stroke);
      color: var(--muted);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.75rem;
    }
    .fake-btn { min-width: 90px; text-align: center; }
    .dynamic-note {
      background: var(--widget);
      border: 1px dashed var(--stroke);
      border-radius: 8px;
      padding: 16px;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
    }
    .footer-link {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.78rem;
      color: var(--muted);
    }
    .footer-link a { color: var(--accent); }
    @media (max-width: 720px) {
      .menu-window {
        height: auto;
        min-height: 480px;
        grid-template-columns: 1fr;
        grid-template-rows: 46px auto 1fr;
      }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--stroke); max-height: 140px; }
      .hud-binds { display: none; }
    }
  </style>
</head>
<body>
  <div class="preview-banner">
    Vista previa del menu de PC — solo visual, ninguna opcion funciona aqui.
    <a href="/panel">Ir al panel remoto</a>
  </div>

  <div class="hud-brand">
    <img src="https://i.imgur.com/Nuy61wA.png" alt="Falcao" />
    <span><span class="accent">Falcao External</span> · 00:42:18 · 14:32</span>
  </div>

  <div class="hud-binds">
    <div class="row"><span class="dot"></span> ESP <span style="margin-left:auto;color:var(--text)">F6</span></div>
    <div class="row"><span class="dot" style="background:#555"></span> Godmode <span style="margin-left:auto;color:var(--text)">—</span></div>
    <div class="row"><span class="dot" style="background:#555"></span> Noclip <span style="margin-left:auto;color:var(--text)">—</span></div>
  </div>

  <div class="scene">
    <div class="menu-window" id="menuWindow">
      <div class="menu-header">
        <img src="https://i.imgur.com/Nuy61wA.png" alt="Falcao" />
        <div>
          <div class="title">Falcao External</div>
          <div class="sub">Showcase — menu de PC</div>
        </div>
        <div class="tools">
          <div class="tool-btn"><i class="fa-solid fa-magnifying-glass"></i></div>
          <div class="tool-btn"><i class="fa-solid fa-circle-info"></i></div>
          <div class="tool-btn"><i class="fa-solid fa-gear"></i></div>
        </div>
      </div>
      <nav class="sidebar" id="sidebar"></nav>
      <main class="content" id="content">
        <p style="color:var(--muted)">Cargando menu...</p>
      </main>
    </div>
  </div>

  <div class="footer-link">
    Panel remoto real: <a href="/panel">/panel</a> · Necesitas el external en tu PC
  </div>

  <script>
    const LANG = "es";
    const SIDEBAR_GROUPS = [
      { icon: "fa-crosshairs", label: "Combate", sections: [0, 1, 2, 3] },
      { icon: "fa-eye", label: "Visuales", sections: [4, 14, 15] },
      { icon: "fa-bolt", label: "Exploits", sections: [5, 6, 7, 8] },
      { icon: "fa-sliders", label: "Misc", sections: [9, 10, 11, 12, 13, 16] }
    ];

    let schema = null;
    let activeSection = 0;
    let expandedGroup = 0;
    const demoValues = new Map();

    function t(obj) { return (obj && (obj[LANG] || obj.en)) || ""; }

    function seedDemo(key, kind, extra) {
      if (demoValues.has(key)) return demoValues.get(key);
      let v;
      if (kind === "bool") v = Math.random() > 0.65;
      else if (kind === "int") v = Math.floor((extra.min || 0) + Math.random() * ((extra.max || 100) - (extra.min || 0)));
      else if (kind === "float") v = +((extra.min || 0) + Math.random() * ((extra.max || 1) - (extra.min || 0))).toFixed(2);
      else if (kind === "bind") v = 0;
      else if (kind === "rgba") v = [0.9, 0.35, 0.13, 1];
      else v = 0;
      demoValues.set(key, v);
      return v;
    }

    function renderToggle(on) {
      return `<div class="ctrl toggle${on ? " on" : ""}"></div>`;
    }

    function renderSlider(val, min, max, step) {
      const pct = Math.min(100, Math.max(0, ((val - min) / (max - min)) * 100));
      const label = Number.isInteger(val) ? val : val.toFixed(2);
      return `<div class="ctrl slider-wrap"><div class="slider-track"><div class="slider-fill" style="width:${pct}%"></div></div><span class="slider-val">${label}</span></div>`;
    }

    function renderSelect(val, options) {
      const list = options && (options[LANG] || options.en) || [];
      const text = list[val] || list[0] || "—";
      return `<div class="ctrl fake-btn">${text}</div>`;
    }

    function renderBind(val) {
      return `<div class="ctrl fake-btn">${val ? "VK " + val : "None"}</div>`;
    }

    function renderItem(item) {
      const v = seedDemo(item.key, item.kind, item);
      if (item.kind === "action") {
        return `<div class="option"><label>${t(item.label)}</label><div class="ctrl fake-btn">${t(item.label)}</div></div>`;
      }
      if (item.kind === "bool" || (item.kind === "int" && item.max === 1 && item.min === 0)) {
        return `<div class="option"><label>${t(item.label)}</label>${renderToggle(!!v)}</div>`;
      }
      if (item.kind === "bind") {
        return `<div class="option"><label>${t(item.label)}</label>${renderBind(v)}</div>`;
      }
      if (item.options) {
        return `<div class="option"><label>${t(item.label)}</label>${renderSelect(v, item.options)}</div>`;
      }
      if (item.kind === "float" || item.kind === "int") {
        return `<div class="option"><label>${t(item.label)}</label>${renderSlider(v, item.min ?? 0, item.max ?? 100, item.step)}</div>`;
      }
      if (item.kind === "rgba") {
        return `<div class="option"><label>${t(item.label)}</label><div class="ctrl" style="width:36px;height:22px;border-radius:4px;background:rgb(232,88,34)"></div></div>`;
      }
      return `<div class="option"><label>${t(item.label)}</label>${renderToggle(false)}</div>`;
    }

    function renderSection() {
      const sec = schema.sections.find(s => s.id === activeSection);
      const el = document.getElementById("content");
      if (!sec) { el.innerHTML = "<p>Seccion no encontrada</p>"; return; }

      let html = `<h2>${t(sec)}</h2>`;
      if (sec.dynamic) {
        const labels = {
          txadmin: "TxAdmin — lista de jugadores y acciones del servidor",
          resources: "Resources — lista de recursos del servidor",
          list: "Lista — jugadores y vehiculos cercanos",
          lua: "Editor Lua — ejecutar scripts en el servidor"
        };
        html += `<div class="dynamic-note"><i class="fa-solid fa-lock"></i> ${labels[sec.dynamic] || sec.dynamic}<br><br>Vista previa: esta seccion requiere el external conectado al juego.</div>`;
      } else {
        for (const grp of sec.groups || []) {
          html += `<div class="group"><div class="group-title">${t(grp)}</div>`;
          for (const item of grp.items || []) html += renderItem(item);
          html += `</div>`;
        }
      }
      el.innerHTML = html;
      renderSidebar();
    }

    function renderSidebar() {
      const nav = document.getElementById("sidebar");
      nav.innerHTML = "";
      SIDEBAR_GROUPS.forEach((grp, gi) => {
        const wrap = document.createElement("div");
        wrap.className = "sb-group";
        const hdr = document.createElement("div");
        hdr.className = "sb-group-hdr" + (expandedGroup === gi ? " open" : "");
        hdr.innerHTML = `<i class="fa-solid ${grp.icon}"></i><span>${grp.label}</span><i class="fa-solid fa-chevron-down" style="margin-left:auto;font-size:.65rem"></i>`;
        hdr.onclick = () => {
          expandedGroup = expandedGroup === gi ? -1 : gi;
          renderSidebar();
        };
        wrap.appendChild(hdr);

        if (expandedGroup === gi) {
          const items = document.createElement("div");
          items.className = "sb-items";
          for (const sid of grp.sections) {
            const sec = schema.sections.find(s => s.id === sid);
            if (!sec) continue;
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "sb-item" + (activeSection === sid ? " active" : "");
            btn.textContent = t(sec);
            btn.onclick = (e) => { e.stopPropagation(); activeSection = sid; renderSection(); };
            items.appendChild(btn);
          }
          wrap.appendChild(items);
        }
        nav.appendChild(wrap);
      });
    }

    async function init() {
      const res = await fetch("/api/panel/schema");
      const data = await res.json();
      schema = data.schema;
      activeSection = 0;
      expandedGroup = 0;
      renderSection();
    }

    init().catch(() => {
      document.getElementById("content").innerHTML = "<p style='color:#ff5d5d'>No se pudo cargar el schema del menu.</p>";
    });
  </script>
</body>
</html>
