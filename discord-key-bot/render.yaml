services:
  - type: web
    name: falcao-discord-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: falcao-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PERSISTENT_DATA_DIR
        value: /var/data/falcao-external
      - key: KEYS_BACKUP_CHANNEL_ID
        value: "1511740812621250712"
      - key: DISCORD_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: MENU_API_TOKEN
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: BASE_URL
        sync: false
